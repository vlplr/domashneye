<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Слайдер</title>
  <style>
    .slider {
      width: 400px;
      margin: 50px auto;
      text-align: center;
      position: relative;
    }

    img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px;
      cursor: pointer;
    }

    #prev { left: -60px; }
    #next { right: -60px; }

    .dots {
      margin-top: 10px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 5px;
      background: gray;
      border-radius: 50%;
      cursor: pointer;
    }

    .active {
      background: black;
    }
  </style>
</head>
<body>

<div class="slider">
  <button id="prev">Prev</button>
  <img id="slide" src="">
  <button id="next">Next</button>

  <div class="dots" id="dots"></div>
</div>

<script>
  const images = [
    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg"
  ];

  let current = 0;

  const img = document.getElementById("slide");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const dotsContainer = document.getElementById("dots");

  // создаём точки
  images.forEach((_, index) => {
    const dot = document.createElement("span");
    dot.classList.add("dot");

    dot.addEventListener("click", () => {
      current = index;
      updateSlider();
    });

    dotsContainer.appendChild(dot);
  });

  function updateSlider() {
    img.src = images[current];

    // скрытие кнопок
    prev.style.display = current === 0 ? "none" : "block";
    next.style.display = current === images.length - 1 ? "none" : "block";

    // активная точка
    document.querySelectorAll(".dot").forEach((dot, i) => {
      dot.classList.toggle("active", i === current);
    });
  }

  prev.addEventListener("click", () => {
    if (current > 0) {
      current--;
      updateSlider();
    }
  });

  next.addEventListener("click", () => {
    if (current < images.length - 1) {
      current++;
      updateSlider();
    }
  });

  // первый запуск
  updateSlider();
</script>

</body>
</html>
